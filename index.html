<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タスクアラーム</title>
<meta name="theme-color" content="#0e121a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700;800&family=Noto+Sans+JP:wght@200;400;500;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ===== タスクアラーム（エルラボ＋ トンマナ：ダーク×ゴールド） ===== */
  :root{
    --gold:#b99455; --gold-2:#e3c381;
    --bg:#090c12; --bg-2:#0e121a;
    --line:rgba(225,197,139,.14); --line-2:rgba(225,197,139,.28);
    --text:#f7f4ec; --text-2:#c9c5bb; --muted:#a8a49b;
    --todo:#938f83; --doing:#5bd68a; --paused:#e0a458; --done:#6d6a62;
    --danger:#d59a9a;
    --card:linear-gradient(145deg,rgba(19,23,33,.80),rgba(10,13,20,.62));
    --shadow:0 24px 70px rgba(0,0,0,.34);
    --gothic:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mincho:"Shippori Mincho B1","Yu Mincho",serif;
    --serif-en:"Cormorant Garamond",Georgia,serif;
    color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{background:var(--bg)}
  body{
    margin:0;min-height:100vh;color:var(--text);font-family:var(--gothic);
    font-size:14px;line-height:1.75;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(900px 520px at 88% -8%,rgba(185,148,85,.10),transparent 62%),
      radial-gradient(760px 520px at -10% 30%,rgba(74,91,124,.12),transparent 64%),
      linear-gradient(180deg,var(--bg-2),var(--bg));
    background-attachment:fixed;
  }
  button,input,select{font:inherit}
  button{-webkit-tap-highlight-color:transparent}
  ::selection{background:rgba(227,195,129,.28);color:#fff}
  .wrap{max-width:880px;margin:0 auto;padding:0 16px 90px}

  /* ===== ヒーロー ===== */
  .hero{text-align:center;padding:46px 8px 34px}
  .ornament{width:42px;height:1px;margin:0 auto 18px;
    background:linear-gradient(90deg,transparent,var(--gold-2),transparent);
    box-shadow:0 0 18px rgba(227,195,129,.45)}
  .hero .ey{font-family:var(--serif-en);font-size:12.5px;font-weight:600;
    letter-spacing:.46em;text-indent:.46em;text-transform:uppercase;color:#d9bd81;opacity:.92}
  .hero h1{font-family:var(--mincho);font-weight:800;font-size:clamp(26px,5vw,34px);
    letter-spacing:.14em;text-indent:.14em;margin:12px 0 0;
    background:linear-gradient(110deg,#fff 10%,#f4ead5 42%,#d9bd81 58%,#fff 78%);
    background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .today{color:var(--muted);font-size:12.5px;letter-spacing:.08em;margin:14px 0 0}
  .clock{font-size:40px;font-weight:200;font-variant-numeric:tabular-nums;
    letter-spacing:.08em;color:var(--gold-2);margin-top:4px;line-height:1.3;
    text-shadow:0 0 26px rgba(227,195,129,.22)}

  /* ===== 共通カード ===== */
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;
    box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(1.1);
    -webkit-backdrop-filter:blur(18px) saturate(1.1)}

  /* ===== 通知バー ===== */
  #permBar{display:none;align-items:center;gap:12px;flex-wrap:wrap;
    padding:13px 18px;margin-bottom:16px;border-radius:16px;font-size:12.5px;color:#f0e4c8;
    background:linear-gradient(145deg,rgba(227,195,129,.13),rgba(227,195,129,.03));
    border:1px solid rgba(227,195,129,.26)}
  #permBar.show{display:flex}

  /* ===== タブ ===== */
  nav{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
  nav button{font-family:var(--gothic);font-size:12.5px;letter-spacing:.06em;
    color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--line);
    padding:8px 22px;border-radius:999px;cursor:pointer;transition:.2s}
  nav button:hover{color:var(--gold-2);border-color:var(--line-2)}
  nav button.on{color:#1c1a14;font-weight:700;border-color:transparent;
    background:linear-gradient(135deg,var(--gold-2),var(--gold));
    box-shadow:0 8px 22px -10px rgba(227,195,129,.6)}

  /* ===== 入力フォーム ===== */
  .form{padding:20px;margin-bottom:16px;display:grid;
    grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
  .form .times{display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--muted)}
  input,select{padding:9px 12px;border:1px solid var(--line-2);border-radius:10px;
    background:rgba(255,255,255,.04);color:var(--text);transition:.18s}
  input::placeholder{color:#7d7a72}
  input[type=time]{width:118px;font-variant-numeric:tabular-nums}
  input:focus,select:focus{outline:none;border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(227,195,129,.12);background:rgba(255,255,255,.06)}
  input[type=range]{padding:0;border:none;background:none;accent-color:var(--gold)}
  input[type=checkbox]{accent-color:var(--gold);width:15px;height:15px}
  .form .row2{grid-column:1/-1;display:flex;gap:18px;align-items:center;flex-wrap:wrap;
    border-top:1px solid var(--line);padding-top:14px;margin-top:2px}
  .chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);
    white-space:nowrap;cursor:pointer;transition:color .18s}
  .chk:hover{color:var(--text-2)}
  .note{font-size:11.5px;color:#7d7a72;letter-spacing:.03em}

  /* ===== ボタン ===== */
  .btn{border:1px solid var(--line-2);background:rgba(255,255,255,.04);color:var(--text-2);
    padding:9px 18px;border-radius:999px;cursor:pointer;letter-spacing:.04em;transition:.2s}
  .btn:hover{color:var(--gold-2);border-color:var(--gold);background:rgba(227,195,129,.08)}
  .btn.primary{color:#1c1a14;font-weight:700;border-color:transparent;
    background:linear-gradient(135deg,var(--gold-2),var(--gold));
    box-shadow:0 10px 26px -12px rgba(227,195,129,.7)}
  .btn.primary:hover{filter:brightness(1.07);color:#1c1a14}

  /* ===== 集計 ===== */
  .summary{display:flex;column-gap:26px;row-gap:4px;padding:15px 22px;margin-bottom:14px;
    font-size:11.5px;color:var(--muted);letter-spacing:.06em;flex-wrap:wrap;align-items:baseline}
  .summary b{font-family:var(--serif-en);font-size:22px;font-weight:600;
    color:var(--gold-2);margin:0 3px;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1}

  /* ===== タスク行 ===== */
  .list{display:flex;flex-direction:column;gap:10px}
  .task{display:flex;align-items:flex-start;gap:16px;padding:16px 20px;
    position:relative;overflow:hidden;transition:border-color .2s,transform .2s}
  .task::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;
    border-radius:2px;background:var(--todo);opacity:.85}
  .task.doing::before{background:var(--doing);box-shadow:0 0 14px rgba(91,214,138,.5)}
  .task.paused::before{background:var(--paused)}
  .task.done::before{background:var(--done)}
  .task.done{opacity:.5}
  .task.now{border-color:rgba(91,214,138,.34)}
  .time{font-family:var(--serif-en);font-size:22px;font-weight:600;letter-spacing:.03em;
    font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;min-width:96px;color:var(--text);line-height:1.25;padding-top:2px}
  .time small{display:block;font-family:var(--gothic);font-size:11px;font-weight:400;
    letter-spacing:.02em;color:var(--muted);margin-top:2px}
  .body{flex:1;min-width:0}
  .title{font-family:var(--mincho);font-weight:700;font-size:15.5px;line-height:1.65;
    letter-spacing:.03em;word-break:break-word}
  .task.done .title{text-decoration:line-through;text-decoration-color:rgba(247,244,236,.35)}
  .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .badge{font-size:10.5px;letter-spacing:.04em;padding:2px 11px;border-radius:999px;
    border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted)}
  .badge.st-todo{color:#b3aea1}
  .badge.st-doing{color:#0e1a13;font-weight:700;background:var(--doing);border-color:var(--doing)}
  .badge.st-paused{color:#1f1509;font-weight:700;background:var(--paused);border-color:var(--paused)}
  .badge.st-done{color:var(--done);border-color:rgba(225,197,139,.10)}
  .badge.carry{color:#e6b877;border-color:rgba(224,164,88,.34);background:rgba(224,164,88,.10)}
  .badge.keep{color:#c9b8ea;border-color:rgba(190,170,235,.30);background:rgba(160,140,220,.10)}
  .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:300px}
  .acts .btn{padding:6px 14px;font-size:11.5px}
  .acts .btn.go{color:#8fe3b4;border-color:rgba(91,214,138,.34)}
  .acts .btn.go:hover{background:rgba(91,214,138,.12);border-color:var(--doing);color:#a8ecc6}
  .acts .btn.pause{color:#eec18a;border-color:rgba(224,164,88,.34)}
  .acts .btn.pause:hover{background:rgba(224,164,88,.12);border-color:var(--paused);color:#f3d0a4}
  .acts .btn.done{color:#1c1a14;font-weight:700;border-color:transparent;
    background:linear-gradient(135deg,var(--gold-2),var(--gold))}
  .acts .btn.done:hover{filter:brightness(1.08);color:#1c1a14}
  .acts .btn.del{color:var(--danger);border-color:rgba(213,154,154,.28)}
  .acts .btn.del:hover{background:rgba(213,154,154,.12);border-color:var(--danger);color:#e8b6b6}
  .empty{padding:54px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:2}

  /* ===== 設定 ===== */
  .setrow{display:flex;align-items:center;gap:12px;padding:15px 22px;
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .setrow:last-of-type{border-bottom:none}
  .setrow label:first-child{min-width:200px;font-size:13px;color:var(--text-2);letter-spacing:.03em}
  .hint{padding:18px 22px;font-size:11.5px;color:var(--muted);line-height:2.1;
    border-top:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:0 0 20px 20px}
  .hint b{color:var(--gold-2);font-weight:600}

  /* ===== 履歴 ===== */
  .daygroup{margin-bottom:20px}
  .dayhead{font-family:var(--serif-en);font-size:13px;letter-spacing:.18em;font-feature-settings:"lnum" 1;
    color:var(--gold);padding:0 4px 9px;margin-bottom:10px;border-bottom:1px solid var(--line)}
  .dayhead span{font-family:var(--gothic);font-size:11px;letter-spacing:.04em;
    color:var(--muted);margin-left:10px}

  /* ===== アラーム ===== */
  #alarm{display:none;position:fixed;inset:0;z-index:60;align-items:center;justify-content:center;
    padding:20px;background:radial-gradient(720px 460px at 50% 45%,rgba(12,12,18,.66),rgba(5,7,11,.90))}
  #alarm.show{display:flex}
  .alarmbox{position:relative;width:min(100%,430px);text-align:center;
    padding:38px 34px 32px;border-radius:28px;
    border:1px solid rgba(238,214,163,.20);
    background:linear-gradient(145deg,rgba(19,23,33,.90),rgba(10,13,20,.80));
    box-shadow:0 40px 100px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(22px) saturate(1.15);-webkit-backdrop-filter:blur(22px) saturate(1.15);
    animation:pop .45s cubic-bezier(.2,.8,.2,1) both}
  @keyframes pop{from{transform:scale(.94) translateY(10px);opacity:0}to{transform:none;opacity:1}}
  .alarmbox::before{content:"";display:block;width:42px;height:1px;margin:0 auto 22px;
    background:linear-gradient(90deg,transparent,var(--gold-2),transparent);
    box-shadow:0 0 18px rgba(227,195,129,.45)}
  .alarmbox .ico{font-size:38px;animation:ring 1.1s infinite}
  @keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(11deg)}75%{transform:rotate(-11deg)}}
  .alarmbox .kind{font-family:var(--gothic);font-size:11.5px;letter-spacing:.16em;text-indent:.16em;
    color:#d9bd81;margin-top:14px}
  .alarmbox .at{font-family:var(--serif-en);font-size:44px;font-weight:600;letter-spacing:.05em;
    font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;color:var(--gold-2);margin:6px 0 2px;line-height:1.15}
  .alarmbox .what{font-family:var(--mincho);font-weight:700;font-size:17px;line-height:1.7;
    letter-spacing:.04em;margin:10px 0 26px;word-break:break-word}
  .alarmbox .btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}

  @media(max-width:680px){
    .hero{padding:34px 4px 26px}
    .form{grid-template-columns:1fr}
    .form .times{justify-content:space-between}
    input[type=time]{flex:1}
    .task{flex-wrap:wrap;gap:12px;padding:15px 17px}
    .time{min-width:82px;font-size:20px}
    .acts{max-width:none;width:100%;justify-content:flex-start}
    .setrow label:first-child{min-width:100%}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="ornament"></div>
    <div class="ey">Task Alarm</div>
    <h1>タスクアラーム</h1>
    <div class="today" id="todayLabel"></div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <div id="permBar">
    <span>🔔 デスクトップ通知がまだ許可されていません。</span>
    <button class="btn primary" id="permBtn">通知を許可する</button>
    <button class="btn" id="testBtn">音をテスト</button>
  </div>

  <nav>
    <button data-tab="today" class="on">今日</button>
    <button data-tab="history">履歴</button>
    <button data-tab="settings">設定</button>
  </nav>

  <!-- ===== 今日 ===== -->
  <section id="tab-today">
    <div class="card form">
      <div class="times">
        <input type="time" id="fStart" step="300">
        <span>〜</span>
        <input type="time" id="fEnd" step="300">
      </div>
      <input type="text" id="fTitle" placeholder="やること（例：ブログ執筆）" maxlength="120">
      <button class="btn primary" id="addBtn">追加する</button>
      <div class="row2">
        <label class="chk"><input type="checkbox" id="fKeep"> 毎日くり返す（ずっと残す）</label>
        <label class="chk"><input type="checkbox" id="fAlarm" checked> アラームを鳴らす</label>
        <span class="note">終了時刻は空でもOK</span>
      </div>
    </div>

    <div class="card summary" id="summary"></div>
    <div class="list" id="todayList"></div>
  </section>

  <!-- ===== 履歴 ===== -->
  <section id="tab-history" hidden>
    <div id="historyList"></div>
  </section>

  <!-- ===== 設定 ===== -->
  <section id="tab-settings" hidden>
    <div class="card">
      <div class="setrow">
        <label for="sPre">開始の何分前に予告通知</label>
        <select id="sPre">
          <option value="0">予告なし</option>
          <option value="1">1分前</option>
          <option value="3">3分前</option>
          <option value="5">5分前</option>
          <option value="10">10分前</option>
          <option value="15">15分前</option>
        </select>
      </div>
      <div class="setrow">
        <label for="sEndAlarm">終了時刻にも鳴らす</label>
        <input type="checkbox" id="sEndAlarm">
      </div>
      <div class="setrow">
        <label for="sSound">アラーム音</label>
        <select id="sSound">
          <option value="bell">ベル（やわらか）</option>
          <option value="beep">ピピッ（電子音）</option>
          <option value="chime">チャイム（3音）</option>
          <option value="none">音なし（通知だけ）</option>
        </select>
        <button class="btn" id="soundTest">試聴</button>
      </div>
      <div class="setrow">
        <label for="sVol">音量</label>
        <input type="range" id="sVol" min="0" max="100" step="5" style="flex:1;max-width:220px">
        <span id="volLabel" class="note"></span>
      </div>
      <div class="setrow">
        <label for="sRepeat">鳴らす長さ</label>
        <select id="sRepeat">
          <option value="1">1回</option>
          <option value="3">3回くり返す</option>
          <option value="6">6回くり返す</option>
          <option value="999">停止するまで鳴らし続ける</option>
        </select>
      </div>
      <div class="setrow">
        <label for="sSnooze">スヌーズ間隔</label>
        <select id="sSnooze">
          <option value="3">3分</option>
          <option value="5">5分</option>
          <option value="10">10分</option>
        </select>
      </div>
      <div class="setrow">
        <label for="sAutoCarry">未完了を翌日に持ち越す</label>
        <input type="checkbox" id="sAutoCarry">
      </div>
      <div class="setrow">
        <label>データ</label>
        <button class="btn" id="exportBtn">バックアップ書き出し</button>
        <button class="btn" id="importBtn">読み込み</button>
        <input type="file" id="importFile" accept="application/json" hidden>
        <button class="btn del" id="clearDone">完了済み履歴を削除</button>
      </div>
      <div class="hint">
        アラームは<b>このタブが開いている間だけ</b>動きます（最小化・裏に回すのはOK、閉じるとNG）。<br>
        ブラウザの仕様で、ページを開いたあと<b>最初に1回どこかをクリック</b>すると音が鳴るようになります。<br>
        データはこのブラウザの中だけに保存されます（別のPC・スマホとは共有されません）。
      </div>
    </div>
  </section>
</div>

<!-- アラーム -->
<div id="alarm">
  <div class="alarmbox">
    <div class="ico">🔔</div>
    <div class="kind" id="alarmKind"></div>
    <div class="at" id="alarmAt"></div>
    <div class="what" id="alarmWhat"></div>
    <div class="btns">
      <button class="btn primary" id="alarmStart">開始する</button>
      <button class="btn" id="alarmSnooze">スヌーズ</button>
      <button class="btn" id="alarmStop">閉じる</button>
    </div>
  </div>
</div>

<script>
/* ============ 保存 ============ */
const KEY_T = 'ta_tasks', KEY_S = 'ta_settings', KEY_D = 'ta_lastday';
const DEF = { pre:5, endAlarm:false, sound:'bell', vol:60, repeat:3, snooze:5, autoCarry:true };

let tasks = load(KEY_T, []);
let cfg   = Object.assign({}, DEF, load(KEY_S, {}));

function load(k, fb){ try{ return JSON.parse(localStorage.getItem(k)) ?? fb; }catch(e){ return fb; } }
function saveTasks(){ localStorage.setItem(KEY_T, JSON.stringify(tasks)); }
function saveCfg(){ localStorage.setItem(KEY_S, JSON.stringify(cfg)); }

/* ============ 日付ユーティリティ ============ */
const pad = n => String(n).padStart(2,'0');
function ymd(d=new Date()){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function hm(d=new Date()){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function toMin(t){ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function jpDate(s){
  const [y,m,d] = s.split('-').map(Number);
  const w = ['日','月','火','水','木','金','土'][new Date(y,m-1,d).getDay()];
  return `${y}年${m}月${d}日(${w})`;
}
function daysBetween(a,b){
  return Math.round((new Date(b+'T00:00') - new Date(a+'T00:00')) / 86400000);
}

/* ============ 繰り越し ============ */
function rollover(){
  const today = ymd();
  let changed = false;
  const todayKeeps = new Set(tasks.filter(t=>t.date===today && t.keepId).map(t=>t.keepId));

  tasks.forEach(t=>{
    if(t.date >= today) return;
    if(t.status === 'done'){
      // 完了したくり返しタスク → 今日の分を新しく作る
      if(t.keepId && !todayKeeps.has(t.keepId)){
        todayKeeps.add(t.keepId);
        tasks.push({ id:uid(), keepId:t.keepId, date:today, start:t.start, end:t.end,
          title:t.title, status:'todo', alarm:t.alarm, origin:today, fired:{} });
        changed = true;
      }
    }else{
      // 未完了 → 持ち越し
      if(cfg.autoCarry){
        if(t.keepId && todayKeeps.has(t.keepId)){ return; }
        if(t.keepId) todayKeeps.add(t.keepId);
        t.date = today;
        t.fired = {};
        changed = true;
      }
    }
  });
  if(changed) saveTasks();
  localStorage.setItem(KEY_D, today);
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ============ 描画 ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST = { todo:'未着手', doing:'進行中', paused:'中断', done:'完了' };

function render(){
  const today = ymd();
  $('#todayLabel').textContent = jpDate(today);

  const list = tasks.filter(t=>t.date===today).sort(sortTask);
  const box = $('#todayList');

  if(!list.length){
    box.innerHTML = '<div class="card empty">今日のタスクはまだありません。<br>上のフォームから追加してください。</div>';
  }else{
    box.innerHTML = list.map(taskHTML).join('');
  }

  // 集計
  const done = list.filter(t=>t.status==='done').length;
  const carried = list.filter(t=>t.origin && t.origin < today).length;
  $('#summary').innerHTML =
    `<span>今日のタスク <b>${list.length}</b> 件</span>` +
    `<span>完了 <b>${done}</b> / 残り <b>${list.length-done}</b></span>` +
    (carried ? `<span>持ち越し <b>${carried}</b> 件</span>` : '');

  renderHistory();
}

function sortTask(a,b){
  const am = toMin(a.start), bm = toMin(b.start);
  if(am === null && bm === null) return 0;
  if(am === null) return 1;
  if(bm === null) return -1;
  return am - bm;
}

function taskHTML(t){
  const cur = nowMin();
  const s = toMin(t.start), e = toMin(t.end);
  const isNow = t.status!=='done' && s!==null && cur>=s && (e===null ? cur < s+60 : cur < e);
  const carryDays = t.origin ? daysBetween(t.origin, t.date) : 0;

  const badges = [`<span class="badge st-${t.status}">${ST[t.status]}</span>`];
  if(carryDays > 0) badges.push(`<span class="badge carry">${carryDays}日持ち越し</span>`);
  if(t.keepId)      badges.push(`<span class="badge keep">毎日くり返し</span>`);
  if(!t.alarm)      badges.push(`<span class="badge">通知なし</span>`);

  let acts = '';
  if(t.status === 'todo')        acts = `<button class="btn go" data-act="doing">▶ 開始</button>`;
  else if(t.status === 'doing')  acts = `<button class="btn pause" data-act="paused">⏸ 中断</button>`;
  else if(t.status === 'paused') acts = `<button class="btn go" data-act="doing">▶ 継続</button>`;
  if(t.status !== 'done') acts += `<button class="btn done" data-act="done">✓ 完了</button>`;
  else                    acts += `<button class="btn" data-act="todo">↩ 戻す</button>`;
  acts += `<button class="btn" data-act="edit">✎</button><button class="btn del" data-act="del">🗑</button>`;

  return `<div class="card task ${t.status}${isNow?' now':''}" data-id="${t.id}">
    <div class="time">${t.start || '--:--'}<small>${t.end ? '〜'+t.end : '　'}</small></div>
    <div class="body">
      <div class="title">${esc(t.title)}</div>
      <div class="meta">${badges.join('')}</div>
    </div>
    <div class="acts">${acts}</div>
  </div>`;
}

function renderHistory(){
  const today = ymd();
  const past = tasks.filter(t=>t.date < today);
  const box = $('#historyList');
  if(!past.length){ box.innerHTML = '<div class="card empty">履歴はまだありません。</div>'; return; }

  const byDay = {};
  past.forEach(t=>{ (byDay[t.date] ||= []).push(t); });

  box.innerHTML = Object.keys(byDay).sort().reverse().slice(0,60).map(d=>{
    const arr = byDay[d].sort(sortTask);
    const done = arr.filter(t=>t.status==='done').length;
    return `<div class="daygroup">
      <div class="dayhead">${jpDate(d)}　完了 ${done}/${arr.length}</div>
      <div class="list">${arr.map(t=>`<div class="card task ${t.status}">
        <div class="time">${t.start||'--:--'}<small>${t.end?'〜'+t.end:'　'}</small></div>
        <div class="body"><div class="title">${esc(t.title)}</div>
          <div class="meta"><span class="badge st-${t.status}">${ST[t.status]}</span></div></div>
      </div>`).join('')}</div>
    </div>`;
  }).join('');
}

/* ============ 操作 ============ */
$('#addBtn').addEventListener('click', addTask);
$('#fTitle').addEventListener('keydown', e=>{ if(e.key==='Enter') addTask(); });

function addTask(){
  const title = $('#fTitle').value.trim();
  if(!title){ $('#fTitle').focus(); return; }
  const start = $('#fStart').value, end = $('#fEnd').value;
  if(start && end && toMin(end) < toMin(start)){
    alert('終了時刻が開始時刻より前になっています。'); return;
  }
  const today = ymd();
  tasks.push({
    id: uid(),
    keepId: $('#fKeep').checked ? uid() : null,
    date: today, origin: today,
    start, end, title,
    status: 'todo',
    alarm: $('#fAlarm').checked,
    fired: {}
  });
  saveTasks();
  $('#fTitle').value = '';
  $('#fKeep').checked = false;
  // 次の入力しやすいように、終了時刻を次の開始時刻へ
  if(end){ $('#fStart').value = end; $('#fEnd').value = ''; }
  render();
  $('#fTitle').focus();
  unlockAudio();
}

$('#todayList').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-act]');
  if(!btn) return;
  const id = e.target.closest('.task').dataset.id;
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  const act = btn.dataset.act;

  if(act === 'del'){
    if(!confirm(`「${t.title}」を削除しますか？`)) return;
    tasks = tasks.filter(x=>x.id!==id);
  }else if(act === 'edit'){
    const nt = prompt('内容', t.title); if(nt===null) return;
    const ns = prompt('開始時刻 (HH:MM / 空欄可)', t.start||''); if(ns===null) return;
    const ne = prompt('終了時刻 (HH:MM / 空欄可)', t.end||''); if(ne===null) return;
    if(nt.trim()) t.title = nt.trim();
    t.start = ns.trim(); t.end = ne.trim();
    t.fired = {};
  }else{
    t.status = act;
    if(act === 'done') t.doneAt = new Date().toISOString();
  }
  saveTasks(); render();
});

/* ============ タブ ============ */
document.querySelectorAll('nav button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on', x===b));
    ['today','history','settings'].forEach(n=>{
      $('#tab-'+n).hidden = (n !== b.dataset.tab);
    });
  });
});

/* ============ 設定 ============ */
function bindCfg(){
  $('#sPre').value = cfg.pre;
  $('#sEndAlarm').checked = cfg.endAlarm;
  $('#sSound').value = cfg.sound;
  $('#sVol').value = cfg.vol;
  $('#volLabel').textContent = cfg.vol + '%';
  $('#sRepeat').value = cfg.repeat;
  $('#sSnooze').value = cfg.snooze;
  $('#sAutoCarry').checked = cfg.autoCarry;
}
$('#sPre').onchange      = e => { cfg.pre = +e.target.value; saveCfg(); };
$('#sEndAlarm').onchange = e => { cfg.endAlarm = e.target.checked; saveCfg(); };
$('#sSound').onchange    = e => { cfg.sound = e.target.value; saveCfg(); };
$('#sVol').oninput       = e => { cfg.vol = +e.target.value; $('#volLabel').textContent = cfg.vol+'%'; saveCfg(); };
$('#sRepeat').onchange   = e => { cfg.repeat = +e.target.value; saveCfg(); };
$('#sSnooze').onchange   = e => { cfg.snooze = +e.target.value; saveCfg(); };
$('#sAutoCarry').onchange= e => { cfg.autoCarry = e.target.checked; saveCfg(); };
$('#soundTest').onclick  = () => { unlockAudio(); playOnce(); };

$('#exportBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify({tasks, cfg}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `taskalarm-backup-${ymd()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
};
$('#importBtn').onclick = ()=> $('#importFile').click();
$('#importFile').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      if(!Array.isArray(d.tasks)) throw 0;
      if(!confirm('現在のデータを上書きします。よろしいですか？')) return;
      tasks = d.tasks; cfg = Object.assign({}, DEF, d.cfg||{});
      saveTasks(); saveCfg(); bindCfg(); rollover(); render();
      alert('読み込みました。');
    }catch(err){ alert('ファイルの形式が正しくありません。'); }
  };
  r.readAsText(f);
  e.target.value = '';
};
$('#clearDone').onclick = ()=>{
  const today = ymd();
  const n = tasks.filter(t=>t.date<today).length;
  if(!n){ alert('削除する履歴はありません。'); return; }
  if(!confirm(`過去の履歴 ${n} 件を削除します。よろしいですか？`)) return;
  tasks = tasks.filter(t=>t.date>=today);
  saveTasks(); render();
};

/* ============ 音 ============ */
let ac = null;
function unlockAudio(){
  if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } }
  if(ac.state === 'suspended') ac.resume();
}
document.addEventListener('click', unlockAudio, {once:true});
document.addEventListener('keydown', unlockAudio, {once:true});

const PATTERN = {
  bell:  [[880,0,.5],[1320,.05,.5]],
  beep:  [[1046,0,.12],[1046,.18,.12],[1046,.36,.12]],
  chime: [[523,0,.4],[659,.22,.4],[784,.44,.7]],
};
function playOnce(){
  if(cfg.sound === 'none' || !ac || ac.state !== 'running') return;
  const vol = cfg.vol/100 * .35;
  (PATTERN[cfg.sound] || PATTERN.bell).forEach(([f, at, dur])=>{
    const t0 = ac.currentTime + at;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = cfg.sound === 'beep' ? 'square' : 'sine';
    o.frequency.value = f;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + .05);
  });
}
let ringTimer = null, ringLeft = 0;
function startRinging(){
  stopRinging();
  ringLeft = cfg.repeat;
  playOnce(); ringLeft--;
  if(ringLeft > 0){
    ringTimer = setInterval(()=>{
      if(ringLeft <= 0){ stopRinging(); return; }
      playOnce(); ringLeft--;
    }, 1600);
  }
}
function stopRinging(){ if(ringTimer){ clearInterval(ringTimer); ringTimer = null; } }

/* ============ 通知 ============ */
function updatePermBar(){
  const need = ('Notification' in window) && Notification.permission !== 'granted';
  $('#permBar').classList.toggle('show', need);
}
$('#permBtn').onclick = async ()=>{
  unlockAudio();
  try{ await Notification.requestPermission(); }catch(e){}
  updatePermBar();
};
$('#testBtn').onclick = ()=>{ unlockAudio(); playOnce(); notify('テスト通知', '音と通知のテストです'); };

function notify(title, body){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  try{
    const n = new Notification(title, { body, tag:'task-alarm', renotify:true, requireInteraction:true });
    n.onclick = ()=>{ window.focus(); n.close(); };
  }catch(e){}
}

/* ============ アラーム判定 ============ */
let current = null;   // 鳴っているタスク
const snoozed = {};   // id+kind -> 再通知する分

function tick(){
  const d = new Date();
  $('#clock').textContent = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());

  // 日付が変わったら繰り越し
  if(localStorage.getItem(KEY_D) !== ymd()){ rollover(); render(); }

  const today = ymd(), cur = nowMin();

  tasks.filter(t=>t.date===today && t.alarm && t.status!=='done').forEach(t=>{
    t.fired ||= {};
    const s = toMin(t.start), e = toMin(t.end);

    // 予告
    if(cfg.pre > 0 && s !== null && !t.fired.pre && cur >= s - cfg.pre && cur < s){
      t.fired.pre = 1; saveTasks();
      fire(t, 'pre', `まもなく開始（${cfg.pre}分前）`, t.start);
    }
    // 開始
    if(s !== null && !t.fired.start && cur >= s && cur < s + 30 && t.status === 'todo'){
      t.fired.start = 1; saveTasks();
      fire(t, 'start', '開始の時間です', t.start);
    }
    // 終了
    if(cfg.endAlarm && e !== null && !t.fired.end && cur >= e && cur < e + 30){
      t.fired.end = 1; saveTasks();
      fire(t, 'end', '終了予定の時間です', t.end);
    }
    // スヌーズ
    Object.keys(snoozed).forEach(k=>{
      if(k.startsWith(t.id+'|') && cur >= snoozed[k]){
        const kind = k.split('|')[1];
        delete snoozed[k];
        fire(t, kind, 'スヌーズ', t.start);
      }
    });
  });

  // 「進行中」表示の更新用に毎分だけ再描画
  if(d.getSeconds() === 0) render();
}

function fire(t, kind, kindLabel, at){
  current = { task:t, kind };
  $('#alarmKind').textContent = kindLabel;
  $('#alarmAt').textContent = at || '';
  $('#alarmWhat').textContent = t.title;
  $('#alarmStart').style.display = (t.status === 'todo') ? '' : 'none';
  $('#alarm').classList.add('show');
  startRinging();
  notify(`⏰ ${t.start||''} ${t.title}`, kindLabel);
}
function closeAlarm(){ stopRinging(); $('#alarm').classList.remove('show'); current = null; }

$('#alarmStop').onclick = closeAlarm;
$('#alarmStart').onclick = ()=>{
  if(current){ current.task.status = 'doing'; saveTasks(); render(); }
  closeAlarm();
};
$('#alarmSnooze').onclick = ()=>{
  if(current) snoozed[current.task.id+'|'+current.kind] = nowMin() + cfg.snooze;
  closeAlarm();
};

/* ============ 起動 ============ */
bindCfg();
updatePermBar();
rollover();
$('#fStart').value = hm();
render();
setInterval(tick, 1000);
tick();
</script>
